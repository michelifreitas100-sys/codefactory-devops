name: CI - CodeFactory Task Manager

# Dispara a pipeline em pushes e pull requests para as branches principais
on:
  push:
    branches: [ "main", "desenvolvimento", "features/**" ]
  pull_request:
    branches: [ "main", "desenvolvimento" ]

jobs:
  build-and-test:
    name: Build, Lint e Testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python na versão usada pelo projeto
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala as dependências da aplicação
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install flake8

      # 4. Lint - garante padrão mínimo de qualidade de código
      - name: Rodar Lint (flake8)
        run: flake8 app --max-line-length=100 --extend-ignore=E203

      # 5. Executa os testes automatizados
      - name: Rodar testes (pytest)
        run: pytest tests/ -v

      # 6. Faz o build da imagem Docker para validar que o Dockerfile está correto
      - name: Build da imagem Docker
        run: docker build -t codefactory-task-manager:ci .
